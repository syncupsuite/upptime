name: Setup CI
on:
  push:
    paths:
      - ".upptimerc.yml"
  repository_dispatch:
    types: [setup]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  issues: write
  actions: write
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Setup Upptime
    runs-on: ubuntu-latest
    env:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      CAN_UPDATE_WORKFLOWS: ${{ secrets.GH_PAT != '' || (vars.GH_APP_ID != '' && secrets.GH_APP_PRIVATE_KEY != '') }}
    steps:
      - name: Create GitHub App token
        id: app_token
        if: ${{ vars.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
      - name: Clear GitHub App private key
        if: ${{ always() }}
        shell: bash
        run: echo "GH_APP_PRIVATE_KEY=" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Skip template update
        if: env.CAN_UPDATE_WORKFLOWS != 'true'
        run: echo "::notice::Skipping update-template; GITHUB_TOKEN cannot modify workflow files. Add a GH_PAT secret (with workflow scope) or a GitHub App to enable it."
      - name: Update template
        if: env.CAN_UPDATE_WORKFLOWS == 'true'
        uses: upptime/uptime-monitor@5811f280953e960b7667f0031a4d326f5f97ba99 # v1.45.0
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@5811f280953e960b7667f0031a4d326f5f97ba99 # v1.45.0
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
          # Configure the secret allowlist in .upptimerc.yml; do not edit this workflow directly.
          SECRETS_CONTEXT: '{}'
      - name: Update summary in README
        uses: upptime/uptime-monitor@5811f280953e960b7667f0031a4d326f5f97ba99 # v1.45.0
        with:
          command: "readme"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Generate graphs
        id: dispatch_graphs
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        continue-on-error: true
        with:
          workflow: Graphs CI
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Setup Node.js for direct graph generation
        if: steps.dispatch_graphs.outcome == 'failure'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Generate graphs directly if dispatch fails
        if: steps.dispatch_graphs.outcome == 'failure'
        uses: upptime/uptime-monitor@5811f280953e960b7667f0031a4d326f5f97ba99 # v1.45.0
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@5811f280953e960b7667f0031a4d326f5f97ba99 # v1.45.0
        with:
          command: "site"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        name: GitHub Pages Deploy
        with:
          github_token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
          publish_dir: "site/status-page/__sapper__/export/"
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
