#
# Local overrides (re-apply if the template regenerates these files):
# - explicit least-privilege `permissions:` (repo default GITHUB_TOKEN is read-only)
# - third-party actions pinned to commit SHAs
# - SECRETS_CONTEXT limited to the `secrets:` allowlist in .upptimerc.yml
